[package]
name = "klaave"
version = "0.1.0"
description = "Agent-native credit protocol on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "klaave"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
